name: Publish reviewed Gen5W release
on:
  push:
    paths:
      - 'Jellyfin-on-GEN5W-2.1.1-gen5w.17-Source.zip'
      - 'Jellyfin-on-GEN5W-2.1.1-gen5w.17-USB.zip'
      - 'SHA256SUMS.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed inputs, publish source, and release unchanged tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,io,json,os,shutil,subprocess,urllib.request,urllib.error,zipfile
          repo=os.environ['GITHUB_REPOSITORY'];root=Path.cwd()
          name='Jellyfin-on-GEN5W-2.1.1-gen5w.17'
          expected={name+'-USB.zip':'08cea2caede1bbbd7b7aae144b3839b509ec0f4859a9e95cca64d08a63cb866d',name+'-Source.zip':'dee22974b08086c2cc278aab115bf61264285bd78efad1fd9b70ed4ad0ec2fac'}
          assets={n:(root/n).read_bytes() for n in expected}
          for n,b in assets.items():assert hashlib.sha256(b).hexdigest()==expected[n],n
          assets['SHA256SUMS.txt']=(root/'SHA256SUMS.txt').read_bytes()
          with zipfile.ZipFile(io.BytesIO(assets[name+'-USB.zip'])) as outer:
              assert set(outer.namelist())=={'NEMESIS.data','Packages/jellyfin.gen5w.libre.zip'}
              with zipfile.ZipFile(io.BytesIO(outer.read('Packages/jellyfin.gen5w.libre.zip'))) as inner:
                  assert hashlib.sha256(inner.read('app/Jellyfin-on-GEN5W.apk')).hexdigest()=='1fc78e04c362e365262f0782cf0aaa0e1b5d8c879d9822ffe4506e7aa50e6f76'
                  assert inner.read('licenses/Jellyfin-GPL-2.0.txt')
          with zipfile.ZipFile(io.BytesIO(assets[name+'-Source.zip'])) as source:
              for entry in source.infolist():
                  if entry.is_dir():continue
                  assert entry.filename.startswith('Jellyfin-on-GEN5W/')
                  relative=entry.filename[len('Jellyfin-on-GEN5W/'):]
                  dest=(root/relative).resolve();assert dest.is_relative_to(root)
                  dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(source.read(entry))
          for n in expected:(root/n).unlink()
          # One-time publication helper: remove it from the final source tree.
          Path('.github/workflows/publish-reviewed-release.yml').unlink()
          subprocess.run(['git','config','user.name','ntwm787'],check=True)
          subprocess.run(['git','config','user.email','349138637+ntwm787@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--all'],check=True)
          subprocess.run(['git','commit','-m','Release tested Jellyfin on GEN5W source, credits and licenses'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          base='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Gen5W-reviewed-release'}
          def api(url,data=None,method=None,content_type=None):
              h=dict(headers)
              if content_type:h['Content-Type']=content_type
              elif data is not None:data=json.dumps(data).encode();h['Content-Type']='application/json'
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              with urllib.request.urlopen(req,timeout=120) as response:return json.load(response)
          release=api(base+'/releases',{'tag_name':'v2.1.1-gen5w.17','target_commitish':commit,'name':'Jellyfin on GEN5W - tested release','body':Path('RELEASE-NOTES.md').read_text(),'draft':True,'prerelease':False},'POST')
          upload=release['upload_url'].split('{',1)[0]
          for n,b in assets.items():
              from urllib.parse import quote
              result=api(upload+'?name='+quote(n),b,'POST','application/zip' if n.endswith('.zip') else 'text/plain')
              assert result['size']==len(b)
          release=api(base+'/releases/'+str(release['id']),{'draft':False,'make_latest':'true'},'PATCH')
          print('Published',release['html_url'],'source commit',commit)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Published tested release: '+release['html_url']+'\n')
          PY
