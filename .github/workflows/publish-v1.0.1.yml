name: Publish v1.0.1 store dependency update
on:
  push:
    paths:
      - '.github/workflows/publish-v1.0.1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish a new release, preserving v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,io,json,os,subprocess,urllib.request,urllib.parse,zipfile
          root=Path.cwd();base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Gen5W-v1.0.1-publication'}
          def api(url,data=None,method=None,content_type=None):
              h=dict(headers)
              if content_type:h['Content-Type']=content_type
              elif data is not None:data=json.dumps(data).encode();h['Content-Type']='application/json'
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=120) as r:
                  b=r.read();return json.loads(b) if b else None
          old_release=api(base+'/releases/tags/v1.0.0')
          old_tag=api(base+'/git/ref/tags/v1.0.0')
          old_asset=next(a for a in old_release['assets'] if a['name']=='Jellyfin-on-GEN5W-v1.0.0-USB.zip')
          with urllib.request.urlopen(urllib.request.Request(old_asset['browser_download_url'],headers={'User-Agent':'Gen5W-v1.0.1-publication'}),timeout=120) as r:blob=r.read()
          with zipfile.ZipFile(io.BytesIO(blob)) as outer:
              with zipfile.ZipFile(io.BytesIO(outer.read('Packages/jellyfin.gen5w.libre.zip'))) as inner:apk=inner.read('app/Jellyfin-on-GEN5W.apk');guard=inner.read('guard/netguard.sh')
          assert hashlib.sha256(apk).hexdigest()=='1fc78e04c362e365262f0782cf0aaa0e1b5d8c879d9822ffe4506e7aa50e6f76'
          assert guard==Path('network-guard/netguard.sh').read_bytes()
          updates={"README.md":"# Jellyfin on GEN5W\n\n**Tested and confirmed working on a Gen5W head unit.** Stream your Jellyfin library through NEMESIS, with video, music, audio-track selection, subtitles and Quick Connect.\n\nThis is an independent Gen5W port of **Jellyfin Android v2.1.1 Libre**, made possible by the Jellyfin project and its contributors. It is not an official Jellyfin release. See [credits](CREDITS.md) and [licenses](THIRD-PARTY-NOTICES.md).\n\n## Download\n\nDownload the **[USB installer](https://github.com/ntwm787/Jellyfin-on-GEN5W/releases/latest/download/Jellyfin-on-GEN5W-v1.0.1-USB.zip)** from [Releases](https://github.com/ntwm787/Jellyfin-on-GEN5W/releases/latest).\n\nThe USB ZIP contains only `NEMESIS.data` and `Packages/jellyfin.gen5w.libre.zip`. Source code is provided separately in this repository and as a release source archive.\n\n## Source code\n\n- **[Browse the source code](SOURCE-CODE.md)** - links to the application, network helper and build files.\n- **[Download the complete source code ZIP](https://github.com/ntwm787/Jellyfin-on-GEN5W/releases/download/v1.0.1/Jellyfin-on-GEN5W-v1.0.1-Source.zip)**.\n- [Build instructions](docs/BUILD.md).\n\n## Requirements\n\nA Gen5W system running Android 4.4 / API 19 with 32-bit ARM and NEMESIS installed, plus a Jellyfin server reachable through head-unit **Wi-Fi**, such as a phone hotspot.\n\nDesigned for Gen5W without a firmware-version or vehicle-model lock. Other infotainment generations are not supported. Vehicle testing confirms the tested setup, not every Gen5W variant.\n\n## Setup order\n\n1. Install the **[Gen5 codec patch](https://github.com/KramerTech/gen5-codec-patch)**.\n2. Install **[KeyBORD](https://github.com/ntwm787/KeyBORD-Gen5W)**.\n3. Activate the keyboard using **KeyBridge**, provided in the [KeyBORD repository](https://github.com/ntwm787/KeyBORD-Gen5W).\n4. Install **Jellyfin on GEN5W**.\n\nTo install Jellyfin, park the vehicle and let the head unit finish booting. Extract the USB installer ZIP to the USB root. Keep `jellyfin.gen5w.libre.zip` intact inside the NEMESIS **`Packages` folder**, with `NEMESIS.data` at the root. Use one NEMESIS operation per drive. Insert the drive, confirm installation and launch **Jellyfin on GEN5W** from NEMESIS Manager.\n\n## NEMESIS store dependencies\n\nThe store installer declares these dependencies:\n\n| Package | Minimum package version | Purpose |\n|---|---|---|\n| `media.codecs` | 2.1 | Gen5 video codec patch |\n| `keyboard.hackers` | 2.0.1 | KeyBORD / Hacker's Keyboard for typing |\n| `keyboard.activate` | 2.0.1 | KeyBridge keyboard activation |\n\nThe keyboard is needed for entering text; Jellyfin itself can run without it. These are installer dependencies required for this store package. NEMESIS checks the registered package IDs, versions and the dependency packages' own compatibility rules. The app's runtime behavior is unchanged.\n\nFor the publisher portal, use the **[NEMESIS store package](https://github.com/ntwm787/Jellyfin-on-GEN5W/releases/download/v1.0.1/Jellyfin-on-GEN5W-v1.0.1-NEMESIS.zip)**. The USB wrapper is for installation from a drive.\n\n## Keyboard and sign-in\n\nAfter KeyBORD is activated with KeyBridge, you can use the keyboard in Jellyfin. If KeyBORD already works on your head unit, it will work here too; no setup again is needed.\n\nConnect the head unit to Wi-Fi and wait for network protection to be ready. Use the keyboard to enter at least your **server address and username** when signing in with a username, plus your password if required.\n\n**Quick Connect works!** Enter the server address and choose Quick Connect on the Jellyfin sign-in screen as an alternative to entering a username and password. The server screen also has **KeyBORD setup & sign-in** help.\n\n## Confirmed behavior\n\n- Video and audio playback work; audio is fully restored in this release.\n- In-player **audio-track and subtitle selection work**. Track changes may reload the stream at the current position.\n- The Back button and left-edge swipe stop video and return to the previous Jellyfin screen.\n- The factory media-app screen appears only when exiting the app, reported by the tester as normal head-unit behavior.\n- Quick Connect works.\n\nSee the [testing record](docs/TESTED.md) for the confirmation and its scope.\n\n## Playback and network rules\n\n- Video requires fresh factory confirmation that the vehicle is stationary in Park. Unknown vehicle status blocks video.\n- Streaming adapts to connection speed, up to **1080p**.\n- Content downloads are disabled.\n## Network protection\n\nJellyfin includes a small background helper installed through NEMESIS. It restricts Jellyfin's internet access to Wi-Fi so the app cannot use the BlueLink modem.\n\nThe USB installer installs both Jellyfin and this helper. Installing the APK by itself does not include the helper.\n\n**Install using the NEMESIS USB package. It includes the protection that blocks BlueLink modem data.**\n\nUse head-unit Wi-Fi or a phone hotspot. Android Auto internet sharing has not been verified for this app.\n\n## Licenses and credits\n\nThe Jellyfin Android application retains the upstream **GNU GPL v2** license. The Jellyfin API client retains its MIT license, and vendored ExoPlayer, Koin and ModernAndroidPreferences retain Apache-2.0 licenses. Original notices remain in their source trees. Installer/wrapper code retains its separate MIT notice; that does not relicense the Jellyfin app.\n\nRead [CREDITS.md](CREDITS.md), [THIRD-PARTY-NOTICES.md](THIRD-PARTY-NOTICES.md), [LICENSE](LICENSE) and [build instructions](docs/BUILD.md).\n","SOURCE-CODE.md":"# Source code\n\n## Browse the source files\n\n| What you want to view | Source location |\n|---|---|\n| Jellyfin application code and resources | [Application source](jellyfin-gen5w/app/src/main/) |\n| Complete Android project, dependencies and build configuration | [Android project source](jellyfin-gen5w/) |\n| Wi-Fi / BlueLink network protection helper | [Network helper source](network-guard/) |\n| NEMESIS installer descriptor and scripts | [Installer source](packaging/) |\n| Build and packaging tools | [Build tools source](tools/) |\n\n## Download the source code\n\n**[Download the complete source code ZIP](https://github.com/ntwm787/Jellyfin-on-GEN5W/releases/download/v1.0.1/Jellyfin-on-GEN5W-v1.0.1-Source.zip)** for v1.0.1.\n\nSee the [build instructions](docs/BUILD.md), [Jellyfin and third-party credits](CREDITS.md), [GPL license](LICENSE) and [third-party license notices](THIRD-PARTY-NOTICES.md).\n","RELEASE-NOTES.md":"# Jellyfin on GEN5W - v1.0.1\n\nPackaging update for the NEMESIS store. The APK is unchanged from the vehicle-tested v1.0.0 release; audio, audio-track selection, subtitles and Back/swipe retain the confirmed app behavior. This revised installer has been validated locally; store acceptance and a new vehicle installation have not been confirmed.\n\n## Declared installer dependencies\n\n- media.codecs >=2.1 - Gen5 codec patch.\n- keyboard.hackers >=2.0.1 - KeyBORD / Hacker's Keyboard.\n- keyboard.activate >=2.0.1 - KeyBridge activation.\n\nThe keyboard is for typing, not a runtime requirement of Jellyfin itself. The NEMESIS store installer checks these registered packages as dependencies.\n\n## Setup order\n\n1. Install the [Gen5 codec patch](https://github.com/KramerTech/gen5-codec-patch).\n2. Install [KeyBORD](https://github.com/ntwm787/KeyBORD-Gen5W).\n3. Activate the keyboard with KeyBridge from the KeyBORD repository.\n4. Install Jellyfin.\n\nUse the NEMESIS package ZIP for the publisher portal, or the USB ZIP for installation from a drive. Source and SHA256SUMS.txt are supplied separately. Quick Connect works; an existing working keyboard remains usable by the app.\n\nJellyfin includes a background helper installed through NEMESIS that restricts the app to Wi-Fi and blocks BlueLink modem data. The USB/store package installs both the app and helper. An APK by itself does not include the helper.\n\nCredit belongs to the Jellyfin project and contributors. The app retains the upstream GPL v2 license, with MIT/Apache notices preserved for the API client, libraries and wrapper tooling. See CREDITS.md and THIRD-PARTY-NOTICES.md.\n","docs/BUILD.md":"# Build and package\n\nUse JDK 11, Python 3.10+ and an Android SDK with platform 30 and build-tools 29.0.3. Accept the SDK license, set JAVA_HOME to JDK 11 and ANDROID_HOME (or ANDROID_SDK_ROOT) to the SDK. Internet access is needed for the included Gradle 6.6.1 wrapper and Maven dependencies on first build.\n\nFrom the repository root:\n\n    python tools/build.py\n\nThe APK appears in jellyfin-gen5w/app/build/outputs/apk/libre/debug/. The internal debug app ID is retained for install/network-guard compatibility. The distributed APK is development signed and debuggable. Publication does not change the tested payload or migrate signing keys.\n\nTo create the NEMESIS store package, USB-only installer and source ZIPs plus checksums:\n\n    python tools/package.py --apk path/to/jellyfin-android-v2.1.1-gen5w.17-libre-debug.apk\n\nOutputs go to dist/. The packager uses the editable descriptor/scripts in packaging/, the root network guard, complete curated source and license/credit files. No old build artifacts, collected firmware or private reports are needed.\n\nRun the player regression:\n\n    node tests/manual-stop-regression.cjs jellyfin-gen5w/app/src/main/assets/gen5w-client.js\n\nLint must have zero NewApi findings. Five existing errors remain in voice-search handlers and formatting; upstream abortOnError=false remains. Local checks are separate from the user-confirmed vehicle result in TESTED.md.\n\nSource provenance is in jellyfin-gen5w/SOURCE-PROVENANCE.json. Source changes are described in MODIFICATIONS.md; original notices remain in vendored trees. Excluded test media and the prebuilt ktlint utility are not build inputs.\n\nThe published USB APK must match docs/RELEASE-MANIFEST.json. Rebuilds can differ because of environment/debug signing. A newly rebuilt APK must not be called vehicle-tested without confirmation.\n\nThe first public release is v1.0.0. Its NEMESIS package version is 1.0.0. The unchanged vehicle-tested APK retains internal version 2.1.1-gen5w.17; see RELEASE-MANIFEST.json for its SHA-256.\n\nThe descriptor explicitly requires media.codecs >=2.1, keyboard.hackers >=2.0.1 and keyboard.activate >=2.0.1. These are NEMESIS package IDs, not Android application IDs. Store and USB packages contain the same inner installer bytes.\n","docs/RELEASE-MANIFEST.json":"{\n  \"tested_apk_sha256\": \"1fc78e04c362e365262f0782cf0aaa0e1b5d8c879d9822ffe4506e7aa50e6f76\",\n  \"vehicle_tested\": true,\n  \"confirmation_source\": \"head-unit user, 2026-11-05\",\n  \"confirmed\": [\n    \"audio fully working\",\n    \"audio-track and subtitle selection\",\n    \"video and Back/swipe navigation\",\n    \"factory media-app screen only when exiting; reported normal\",\n    \"Quick Connect confirmed earlier\"\n  ],\n  \"firmware_or_model_lock\": false,\n  \"all_gen5w_variants_tested\": false,\n  \"payload_rebuilt_for_release\": false,\n  \"public_version\": \"1.0.1\",\n  \"internal_build_version\": \"2.1.1-gen5w.17\",\n  \"package_vehicle_tested\": false,\n  \"package_change\": \"Installer dependencies declared; unchanged vehicle-tested APK\"\n}\n","packaging/NEMESIS.data":"[nemesis]\nversion=1.1\nid=jellyfin.gen5w.libre\nname=Jellyfin on GEN5W\ntype=application,service\npackage-version=1.0.1\nshort-desc=Jellyfin: lighter UI, parked video, downloads disabled.\ndetailed-desc=Requires the Gen5 codec patch, then KeyBORD. Activate the keyboard with KeyBridge from the KeyBORD project, then install Jellyfin. Existing working KeyBORD works. Quick Connect works. No firmware-version lock.\nos=any\nmodels=any\ndepends=media.codecs@>=2.1,keyboard.hackers@>=2.0.1,keyboard.activate@>=2.0.1\npreinstall=scripts/pre.sh\npreuninstall=guard/preuninstall.sh\n\n[app.0]\nkind=apk\npath=app/Jellyfin-on-GEN5W.apk\npackage=org.jellyfin.gen5w.debug\ncomponent=org.jellyfin.gen5w.debug/org.jellyfin.mobile.MainActivity\n\n[service.0]\nname=jellyfin-network\nkind=sh\npath=guard/netguard.sh\nuid=root\nmode=restart\n","tools/package.py":"\"\"\"Package an APK as a USB installer with corresponding source and licenses.\"\"\"\nfrom pathlib import Path\nimport argparse,hashlib,io,json,re,zipfile\nROOT=Path(__file__).resolve().parents[1]\ndef pack(files):\n    b=io.BytesIO()\n    with zipfile.ZipFile(b,'w',zipfile.ZIP_DEFLATED) as z:\n        for name,data in sorted(files.items()):\n            i=zipfile.ZipInfo(name,(2026,11,5,0,0,0));i.create_system=3;i.compress_type=zipfile.ZIP_DEFLATED\n            i.external_attr=(0o100755 if name.endswith(('.sh','gradlew')) else 0o100644)<<16\n            z.writestr(i,data)\n    return b.getvalue()\ndef main():\n    p=argparse.ArgumentParser();p.add_argument('--apk',type=Path,required=True);p.add_argument('--out',type=Path,default=ROOT/'dist');a=p.parse_args()\n    apk=a.apk.read_bytes();v=json.loads((ROOT/'docs/RELEASE-MANIFEST.json').read_text())['public_version'];name='Jellyfin-on-GEN5W-v'+v\n    meta=(ROOT/'packaging/NEMESIS.data').read_bytes()\n    for key,limit in [('short-desc',64),('detailed-desc',256)]:\n        t=re.search(r'(?m)^'+key+r'=(.*)$',meta.decode());assert t and len(t.group(1).rstrip('\\r'))<=limit\n    assert ('package-version='+v).encode() in meta\n    dep=re.search(r'(?m)^depends=(.*)$',meta.decode());assert dep\n    assert set(dep.group(1).strip().strip(chr(34)).split(','))=={'media.codecs@>=2.1','keyboard.hackers@>=2.0.1','keyboard.activate@>=2.0.1'}\n    with zipfile.ZipFile(io.BytesIO(apk)) as z:assert z.testzip() is None\n    inner={'NEMESIS.data':meta,'app/Jellyfin-on-GEN5W.apk':apk,'scripts/pre.sh':(ROOT/'packaging/scripts/pre.sh').read_bytes()}\n    for folder,prefix in [('network-guard','guard'),('licenses','licenses')]:\n        for f in (ROOT/folder).iterdir():\n            if f.is_file():inner[prefix+'/'+f.name]=f.read_bytes()\n    for f in ['README.md','SOURCE-CODE.md','CREDITS.md','THIRD-PARTY-NOTICES.md','MODIFICATIONS.md']:inner[f]=(ROOT/f).read_bytes()\n    inner['TESTED.md']=(ROOT/'docs/TESTED.md').read_bytes()\n    source={}\n    for f in ROOT.rglob('*'):\n        if not f.is_file():continue\n        rel=f.relative_to(ROOT)\n        if any(x in {'.git','.gradle','build','dist','work','__pycache__'} for x in rel.parts):continue\n        if f.name=='local.properties' or f.suffix.lower() in {'.apk','.zip','.jks','.keystore','.p12','.pem','.key'}:continue\n        source['Jellyfin-on-GEN5W/'+rel.as_posix()]=f.read_bytes()\n    a.out.mkdir(parents=True,exist_ok=True)\n    store=pack(inner)\n    assets={name+'-NEMESIS.zip':store,name+'-USB.zip':pack({'NEMESIS.data':(ROOT/'packaging/USB-NEMESIS.data').read_bytes(),'Packages/jellyfin.gen5w.libre.zip':store}),name+'-Source.zip':pack(source)}\n    for n,d in assets.items():(a.out/n).write_bytes(d)\n    manifest={n:{'sha256':hashlib.sha256(d).hexdigest(),'bytes':len(d)} for n,d in assets.items()}\n    (a.out/'SHA256SUMS.txt').write_text(''.join(i['sha256']+'  '+n+'\\n' for n,i in sorted(manifest.items())),encoding='utf-8')\n    print(json.dumps(manifest,indent=2))\nif __name__=='__main__':main()\n"}
          for filename,text in updates.items():Path(filename).write_text(text,encoding='utf-8')
          Path('.github/workflows/publish-v1.0.1.yml').unlink()
          Path('SHA256SUMS.txt').unlink()
          apk_path=Path('/tmp/vehicle-tested.apk');apk_path.write_bytes(apk)
          output=Path('/tmp/release-v1.0.1')
          subprocess.run(['python3','tools/package.py','--apk',str(apk_path),'--out',str(output)],check=True)
          assets={p.name:p.read_bytes() for p in output.iterdir() if p.is_file()}
          name='Jellyfin-on-GEN5W-v1.0.1'
          assert set(assets)=={name+'-USB.zip',name+'-NEMESIS.zip',name+'-Source.zip','SHA256SUMS.txt'}
          with zipfile.ZipFile(io.BytesIO(assets[name+'-NEMESIS.zip'])) as store:
              meta=store.read('NEMESIS.data')
              assert b'package-version=1.0.1' in meta
              assert b'depends=media.codecs@>=2.1,keyboard.hackers@>=2.0.1,keyboard.activate@>=2.0.1' in meta
              assert store.read('app/Jellyfin-on-GEN5W.apk')==apk
              assert store.read('guard/netguard.sh')==guard
          with zipfile.ZipFile(io.BytesIO(assets[name+'-USB.zip'])) as usb:assert usb.read('Packages/jellyfin.gen5w.libre.zip')==assets[name+'-NEMESIS.zip']
          Path('SHA256SUMS.txt').write_bytes(assets['SHA256SUMS.txt'])
          changes=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changes<=set(updates)|{'.github/workflows/publish-v1.0.1.yml','SHA256SUMS.txt'},changes
          subprocess.run(['git','config','user.name','ntwm787'],check=True)
          subprocess.run(['git','config','user.email','349138637+ntwm787@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--all'],check=True)
          subprocess.run(['git','commit','-m','Publish v1.0.1 with declared NEMESIS store dependencies'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          release=api(base+'/releases',{'tag_name':'v1.0.1','target_commitish':commit,'name':'Jellyfin on GEN5W v1.0.1 - NEMESIS store dependencies','body':Path('RELEASE-NOTES.md').read_text(),'draft':True,'prerelease':False},'POST')
          upload=release['upload_url'].split('{',1)[0]
          for n,b in assets.items():
              label='Source code (complete project)' if n.endswith('-Source.zip') else 'NEMESIS store package' if n.endswith('-NEMESIS.zip') else 'USB installer' if n.endswith('-USB.zip') else ''
              result=api(upload+'?name='+urllib.parse.quote(n)+('&label='+urllib.parse.quote(label) if label else ''),b,'POST','application/zip' if n.endswith('.zip') else 'text/plain')
              assert result['size']==len(b)
          release=api(base+'/releases/'+str(release['id']),{'draft':False,'make_latest':'true'},'PATCH')
          after=api(base+'/releases/tags/v1.0.0')
          assert after['id']==old_release['id'] and after['body']==old_release['body']
          assert [(a['id'],a['name'],a['size'],a.get('digest')) for a in after['assets']]==[(a['id'],a['name'],a['size'],a.get('digest')) for a in old_release['assets']]
          assert api(base+'/git/ref/tags/v1.0.0')['object']['sha']==old_tag['object']['sha']
          print('Published new release:',release['html_url'],'v1.0.0 preserved')
          PY
