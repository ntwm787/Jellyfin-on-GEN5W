name: Explain the network helper
on:
  push:
    paths:
      - '.github/workflows/explain-network-helper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish documentation-only update around the unchanged tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,io,json,os,subprocess,urllib.request,urllib.parse,zipfile
          root=Path.cwd();base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Gen5W-documentation-update'}
          def api(url,data=None,method=None,content_type=None):
              h=dict(headers)
              if content_type:h['Content-Type']=content_type
              elif data is not None:data=json.dumps(data).encode();h['Content-Type']='application/json'
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=120) as r:
                  b=r.read();return json.loads(b) if b else None
          release=api(base+'/releases/436160397');assert release['tag_name']=='v1.0.0'
          previous={a['name']:a for a in release['assets']}
          name='Jellyfin-on-GEN5W-v1.0.0'
          old=previous[name+'-USB.zip']
          with urllib.request.urlopen(urllib.request.Request(old['browser_download_url'],headers={'User-Agent':'Gen5W-documentation-update'}),timeout=120) as r:blob=r.read()
          with zipfile.ZipFile(io.BytesIO(blob)) as outer:
              with zipfile.ZipFile(io.BytesIO(outer.read('Packages/jellyfin.gen5w.libre.zip'))) as inner:apk=inner.read('app/Jellyfin-on-GEN5W.apk');guard=inner.read('guard/netguard.sh')
          assert hashlib.sha256(apk).hexdigest()=='1fc78e04c362e365262f0782cf0aaa0e1b5d8c879d9822ffe4506e7aa50e6f76'
          assert guard==Path('network-guard/netguard.sh').read_bytes()
          updates={"README.md":"# Jellyfin on GEN5W\n\n**Tested and confirmed working on a Gen5W head unit.** Stream your Jellyfin library through NEMESIS, with video, music, audio-track selection, subtitles and Quick Connect.\n\nThis is an independent Gen5W port of **Jellyfin Android v2.1.1 Libre**, made possible by the Jellyfin project and its contributors. It is not an official Jellyfin release. See [credits](CREDITS.md) and [licenses](THIRD-PARTY-NOTICES.md).\n\n## Download\n\nDownload the **[USB installer](https://github.com/ntwm787/Jellyfin-on-GEN5W/releases/latest/download/Jellyfin-on-GEN5W-v1.0.0-USB.zip)** from [Releases](https://github.com/ntwm787/Jellyfin-on-GEN5W/releases/latest).\n\nThe USB ZIP contains only `NEMESIS.data` and `Packages/jellyfin.gen5w.libre.zip`. Source code is provided separately in this repository and as a release source archive.\n\n## Requirements\n\nA Gen5W system running Android 4.4 / API 19 with 32-bit ARM and NEMESIS installed, plus a Jellyfin server reachable through head-unit **Wi-Fi**, such as a phone hotspot.\n\nDesigned for Gen5W without a firmware-version or vehicle-model lock. Other infotainment generations are not supported. Vehicle testing confirms the tested setup, not every Gen5W variant.\n\n## Setup order\n\n1. Install the **[Gen5 codec patch](https://github.com/KramerTech/gen5-codec-patch)**.\n2. Install **[KeyBORD](https://github.com/ntwm787/KeyBORD-Gen5W)**.\n3. Activate the keyboard using **KeyBridge**, provided in the [KeyBORD repository](https://github.com/ntwm787/KeyBORD-Gen5W).\n4. Install **Jellyfin on GEN5W**.\n\nTo install Jellyfin, park the vehicle and let the head unit finish booting. Extract the USB installer ZIP to the USB root. Keep `jellyfin.gen5w.libre.zip` intact inside the NEMESIS **`Packages` folder**, with `NEMESIS.data` at the root. Use one NEMESIS operation per drive. Insert the drive, confirm installation and launch **Jellyfin on GEN5W** from NEMESIS Manager.\n\n## Keyboard and sign-in\n\nAfter KeyBORD is activated with KeyBridge, you can use the keyboard in Jellyfin. If KeyBORD already works on your head unit, it will work here too; no setup again is needed.\n\nConnect the head unit to Wi-Fi and wait for network protection to be ready. Use the keyboard to enter at least your **server address and username** when signing in with a username, plus your password if required.\n\n**Quick Connect works!** Enter the server address and choose Quick Connect on the Jellyfin sign-in screen as an alternative to entering a username and password. The server screen also has **KeyBORD setup & sign-in** help.\n\n## Confirmed behavior\n\n- Video and audio playback work; audio is fully restored in this release.\n- In-player **audio-track and subtitle selection work**. Track changes may reload the stream at the current position.\n- The Back button and left-edge swipe stop video and return to the previous Jellyfin screen.\n- The factory media-app screen appears only when exiting the app, reported by the tester as normal head-unit behavior.\n- Quick Connect works.\n\nSee the [testing record](docs/TESTED.md) for the confirmation and its scope.\n\n## Playback and network rules\n\n- Video requires fresh factory confirmation that the vehicle is stationary in Park. Unknown vehicle status blocks video.\n- Streaming adapts to connection speed, up to **1080p**.\n- Content downloads are disabled.\n## Network protection\n\nJellyfin includes a small background helper installed through NEMESIS. It restricts Jellyfin's internet access to Wi-Fi so the app cannot use the BlueLink modem.\n\nThe USB installer installs both Jellyfin and this helper. Installing the APK by itself does not include the helper.\n\n**Install using the NEMESIS USB package. It includes the protection that blocks BlueLink modem data.**\n\nUse head-unit Wi-Fi or a phone hotspot. Android Auto internet sharing has not been verified for this app.\n\n## Source and licenses\n\nThe Jellyfin Android application retains the upstream **GNU GPL v2** license. The Jellyfin API client retains its MIT license, and vendored ExoPlayer, Koin and ModernAndroidPreferences retain Apache-2.0 licenses. Original notices remain in their source trees. Installer/wrapper code retains its separate MIT notice; that does not relicense the Jellyfin app.\n\nRead [CREDITS.md](CREDITS.md), [THIRD-PARTY-NOTICES.md](THIRD-PARTY-NOTICES.md), [LICENSE](LICENSE) and [build instructions](docs/BUILD.md).\n","RELEASE-NOTES.md":"# Jellyfin on GEN5W - v1.0.0\n\nFirst public release.\n\n**Tested and confirmed working on a Gen5W head unit.**\n\n- Audio is fully working.\n- In-player audio-track and subtitle selection work.\n- Video and Back/button swipe navigation work.\n- The factory media-app screen appears only when exiting Jellyfin, reported as normal head-unit behavior.\n- Quick Connect works.\n\n## Setup order\n\n1. Install the **[Gen5 codec patch](https://github.com/KramerTech/gen5-codec-patch)**.\n2. Install **[KeyBORD](https://github.com/ntwm787/KeyBORD-Gen5W)**.\n3. Activate the keyboard using **KeyBridge**, provided in the [KeyBORD repository](https://github.com/ntwm787/KeyBORD-Gen5W).\n4. Install **Jellyfin on GEN5W**.\n\nDownload the USB ZIP and extract it to USB root. Keep the inner ZIP intact inside the NEMESIS **Packages** folder. Complete source is provided separately in the repository and Source ZIP. SHA256SUMS.txt covers both ZIPs.\n\nAfter activation with KeyBridge, use KeyBORD to enter your server address and username. An already-working KeyBORD works in Jellyfin. **Quick Connect works** as an alternative to username/password sign-in after entering the server address.\n\nRequires NEMESIS, Gen5W Android API19/ARM, the separate Gen5 codec patch and Wi-Fi. BlueLink modem data and downloads are blocked. Video requires confirmed stationary-in-Park status. Streaming adapts to connection speed up to 1080p. There is no firmware-version or model lock; every Gen5W variant has not been tested.\n\n## Network protection\n\nJellyfin includes a small background helper installed through NEMESIS. It restricts Jellyfin's internet access to Wi-Fi so the app cannot use the BlueLink modem.\n\nThe USB installer installs both Jellyfin and this helper. Installing the APK by itself does not include the helper.\n\n**Install using the NEMESIS USB package. It includes the protection that blocks BlueLink modem data.**\n\nThis independent port is based on Jellyfin Android v2.1.1 Libre. Credit goes to the Jellyfin project and contributors. The application retains its upstream GPL v2 license. MIT/Apache licenses and original copyright notices are preserved; see CREDITS.md and THIRD-PARTY-NOTICES.md. NEMESIS, KeyBORD and the codec patch are separate projects.\n\nThe released APK is the exact vehicle-tested binary. Release preparation changes documentation, credits and package notices only.\n","network-guard/README.md":"# Jellyfin network protection\n\nJellyfin includes a small background helper installed through NEMESIS. It restricts Jellyfin's internet access to Wi-Fi so the app cannot use the BlueLink modem.\n\nThe USB installer installs both Jellyfin and this helper. Installing the APK by itself does not include the helper.\n\n**Install using the NEMESIS USB package. It includes the protection that blocks BlueLink modem data.**\n\n## Technical details\n\nThe NEMESIS helper runs with root privileges to enforce app-specific network restrictions. Its production interface is `wlan0`, verified in the supplied Wi-Fi capture. The app separately requires Android's connected Wi-Fi client state;\nthe head unit broadcasting a hotspot is insufficient. No Android Auto sharing\ninterface is currently allowlisted.\n\nThe service discovers the installed app's UID, installs private IPv4/IPv6 filter\nchains, and allows its traffic only on the approved output interface. Other UIDs\nreturn to their existing firewall policy. It does not disable the modem, modify\nthe main default route or change the global default DNS settings.\n\nDNS needs additional handling: Android 4.4's `dnsproxyd` issues queries under its\nsystem UID. The service uses the legacy per-UID resolver and fwmark controls to\nreserve the logical `jfg5wnet` domain and obtain an app-private DNS socket mark.\nIt converts that mark before stock mangle rules clear it, then subjects those\nqueries to the same interface filter. The logical domain is not a new physical\nnetwork adapter. Failure to establish this state leaves the APK offline.\n\nA root-owned heartbeat under `/data/local/jellyfin-gen5w-network` authorizes the\nAPK only while fresh and matching its UID and kernel boot ID. A lock permits one service instance.\nNormal termination leaves kernel restrictions installed; NEMESIS uninstall first\nstops the service, then force-stops the app and runs scoped cleanup. Cleanup never\nflushes a stock table, clears all resolver mappings or removes another domain.\nIf netd's private state cannot be recovered safely after a daemon restart, the\nservice fails closed; restarting the parked head unit may be needed.\n\n`lab-eth0` is accepted only when `ro.kernel.qemu=1`; it is used to simulate a\npermitted interface in the owned emulator. The NEMESIS service passes no lab\noption, and the APK still refuses an eth0 heartbeat. The tests use controlled\nlocal endpoints and never connect to a vehicle modem.\n\nThe scripts are original wrapper code under the [wrapper MIT license](../licenses/Wrapper-MIT.txt).\nThe Android app retains Jellyfin's GPL-2.0 license. API behavior was checked\nagainst these Android 4.4.2 primary sources:\n\n- [netd resolver command handling](https://android.googlesource.com/platform/system/netd/+/android-4.4.2_r1/CommandListener.cpp)\n- [DNS proxy UID handling](https://android.googlesource.com/platform/system/netd/+/android-4.4.2_r1/DnsProxyListener.cpp)\n- [Private UID marks](https://android.googlesource.com/platform/system/netd/+/android-4.4.2_r1/SecondaryTableController.cpp)\n- [Resolver socket marks](https://android.googlesource.com/platform/bionic/+/android-4.4.2_r1/libc/netbsd/resolv/res_send.c)\n\nLocal tests are not vehicle validation. The package remains a parked-vehicle\ntest candidate until the actual head unit's guard startup and Wi-Fi loss/reconnect\nhave been checked.\n"}
          for filename,text in updates.items():
              assert 'USB installer installs both Jellyfin and this helper' in text
              Path(filename).write_text(text,encoding='utf-8')
          Path('.github/workflows/explain-network-helper.yml').unlink()
          Path('SHA256SUMS.txt').unlink()
          apk_path=Path('/tmp/vehicle-tested.apk');apk_path.write_bytes(apk)
          output=Path('/tmp/release-docs-update')
          subprocess.run(['python3','tools/package.py','--apk',str(apk_path),'--out',str(output)],check=True)
          assets={p.name:p.read_bytes() for p in output.iterdir() if p.is_file()}
          assert set(assets)==set(previous)
          Path('SHA256SUMS.txt').write_bytes(assets['SHA256SUMS.txt'])
          changes=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changes<=set(updates)|{'.github/workflows/explain-network-helper.yml','SHA256SUMS.txt'},changes
          subprocess.run(['git','config','user.name','ntwm787'],check=True)
          subprocess.run(['git','config','user.email','349138637+ntwm787@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--all'],check=True)
          subprocess.run(['git','commit','-m','Explain Wi-Fi protection and the NEMESIS background helper'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          oldtag=api(base+'/git/ref/tags/v1.0.0');assert oldtag['object']['sha']=='9d82fb5a7dce1b87b89faad153bcfd3a8074c1a5'
          api(base+'/git/refs/tags/v1.0.0',{'sha':commit,'force':True},'PATCH')
          release=api(base+'/releases/436160397',{'body':Path('RELEASE-NOTES.md').read_text(),'target_commitish':commit},'PATCH')
          upload=release['upload_url'].split('{',1)[0]
          for n,b in assets.items():
              api(base+'/releases/assets/'+str(previous[n]['id']),method='DELETE')
              result=api(upload+'?name='+urllib.parse.quote(n),b,'POST','application/zip' if n.endswith('.zip') else 'text/plain')
              assert result['size']==len(b)
          print('Updated documentation and release downloads:',release['html_url'])
          PY
