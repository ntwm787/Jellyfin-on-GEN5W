name: Publish first release v1
on:
  push:
    paths:
      - 'Jellyfin-on-GEN5W-v1.0.0-Source.zip'
      - 'Jellyfin-on-GEN5W-v1.0.0-USB.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish first public version without rebuilding tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,io,json,os,subprocess,urllib.request,urllib.error,urllib.parse,zipfile
          root=Path.cwd();repo=os.environ['GITHUB_REPOSITORY'];base='https://api.github.com/repos/'+repo
          name='Jellyfin-on-GEN5W-v1.0.0'
          expected={name+'-USB.zip':'d1f4b73f6ba94030e5fa476112d5ad87babef97ec9e2bb4053c9e2cc560f32c0',name+'-Source.zip':'c860edaedb089e87dd93bd1bbeecf78d5580de1873aa617f36e71a09fca890e3'}
          assets={n:(root/n).read_bytes() for n in expected}
          for n,b in assets.items():assert hashlib.sha256(b).hexdigest()==expected[n]
          assets['SHA256SUMS.txt']=(root/'SHA256SUMS.txt').read_bytes()
          with zipfile.ZipFile(io.BytesIO(assets[name+'-USB.zip'])) as outer:
              assert set(outer.namelist())=={'NEMESIS.data','Packages/jellyfin.gen5w.libre.zip'}
              with zipfile.ZipFile(io.BytesIO(outer.read('Packages/jellyfin.gen5w.libre.zip'))) as inner:
                  assert hashlib.sha256(inner.read('app/Jellyfin-on-GEN5W.apk')).hexdigest()=='1fc78e04c362e365262f0782cf0aaa0e1b5d8c879d9822ffe4506e7aa50e6f76'
                  assert b'package-version=1.0.0' in inner.read('NEMESIS.data')
          with zipfile.ZipFile(io.BytesIO(assets[name+'-Source.zip'])) as source:
              for entry in source.infolist():
                  if entry.is_dir():continue
                  assert entry.filename.startswith('Jellyfin-on-GEN5W/')
                  dest=(root/entry.filename[len('Jellyfin-on-GEN5W/'):]).resolve();assert dest.is_relative_to(root)
                  dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(source.read(entry))
          for n in expected:(root/n).unlink()
          Path('.github/workflows/publish-first-release-v1.yml').unlink()
          subprocess.run(['git','config','user.name','ntwm787'],check=True)
          subprocess.run(['git','config','user.email','349138637+ntwm787@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--all'],check=True)
          subprocess.run(['git','commit','-m','Name the first confirmed public release v1.0.0'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Gen5W-first-release'}
          def api(url,data=None,method=None,content_type=None):
              h=dict(headers)
              if content_type:h['Content-Type']=content_type
              elif data is not None:data=json.dumps(data).encode();h['Content-Type']='application/json'
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              with urllib.request.urlopen(req,timeout=120) as r:
                  body=r.read();return json.loads(body) if body else None
          release=api(base+'/releases/436160397')
          assert release['tag_name']=='v2.1.1-gen5w.17'
          previous_assets=release['assets']
          api(base+'/git/refs',{'ref':'refs/tags/v1.0.0','sha':commit},'POST')
          release=api(base+'/releases/436160397',{'tag_name':'v1.0.0','target_commitish':commit,'name':'Jellyfin on GEN5W v1.0.0 - first release','body':Path('RELEASE-NOTES.md').read_text(),'draft':True,'prerelease':False},'PATCH')
          upload=release['upload_url'].split('{',1)[0]
          for n,b in assets.items():
              if n=='SHA256SUMS.txt':
                  for old in previous_assets:
                      if old['name']==n:api(base+'/releases/assets/'+str(old['id']),method='DELETE')
              result=api(upload+'?name='+urllib.parse.quote(n),b,'POST','application/zip' if n.endswith('.zip') else 'text/plain')
              assert result['size']==len(b)
          for old in previous_assets:
              if old['name'] in {'Jellyfin-on-GEN5W-2.1.1-gen5w.17-USB.zip','Jellyfin-on-GEN5W-2.1.1-gen5w.17-Source.zip'}:
                  api(base+'/releases/assets/'+str(old['id']),method='DELETE')
          release=api(base+'/releases/436160397',{'draft':False,'make_latest':'true'},'PATCH')
          old=api(base+'/git/ref/tags/v2.1.1-gen5w.17')
          assert old['object']['sha']=='1f33110cf9d0063c1cd9e83dc291fa3fa447b566'
          api(base+'/git/refs/tags/v2.1.1-gen5w.17',method='DELETE')
          print('Published first release:',release['html_url'])
          PY
