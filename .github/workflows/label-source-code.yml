name: Label the source code clearly
on:
  push:
    paths:
      - '.github/workflows/label-source-code.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish documentation-only update around the unchanged tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,io,json,os,subprocess,urllib.request,urllib.parse,zipfile
          root=Path.cwd();base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Gen5W-documentation-update'}
          def api(url,data=None,method=None,content_type=None):
              h=dict(headers)
              if content_type:h['Content-Type']=content_type
              elif data is not None:data=json.dumps(data).encode();h['Content-Type']='application/json'
              with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=120) as r:
                  b=r.read();return json.loads(b) if b else None
          release=api(base+'/releases/436160397');assert release['tag_name']=='v1.0.0'
          previous={a['name']:a for a in release['assets']}
          name='Jellyfin-on-GEN5W-v1.0.0'
          old=previous[name+'-USB.zip']
          with urllib.request.urlopen(urllib.request.Request(old['browser_download_url'],headers={'User-Agent':'Gen5W-documentation-update'}),timeout=120) as r:blob=r.read()
          with zipfile.ZipFile(io.BytesIO(blob)) as outer:
              with zipfile.ZipFile(io.BytesIO(outer.read('Packages/jellyfin.gen5w.libre.zip'))) as inner:apk=inner.read('app/Jellyfin-on-GEN5W.apk');guard=inner.read('guard/netguard.sh')
          assert hashlib.sha256(apk).hexdigest()=='1fc78e04c362e365262f0782cf0aaa0e1b5d8c879d9822ffe4506e7aa50e6f76'
          assert guard==Path('network-guard/netguard.sh').read_bytes()
          updates={"README.md":"# Jellyfin on GEN5W\n\n**Tested and confirmed working on a Gen5W head unit.** Stream your Jellyfin library through NEMESIS, with video, music, audio-track selection, subtitles and Quick Connect.\n\nThis is an independent Gen5W port of **Jellyfin Android v2.1.1 Libre**, made possible by the Jellyfin project and its contributors. It is not an official Jellyfin release. See [credits](CREDITS.md) and [licenses](THIRD-PARTY-NOTICES.md).\n\n## Download\n\nDownload the **[USB installer](https://github.com/ntwm787/Jellyfin-on-GEN5W/releases/latest/download/Jellyfin-on-GEN5W-v1.0.0-USB.zip)** from [Releases](https://github.com/ntwm787/Jellyfin-on-GEN5W/releases/latest).\n\nThe USB ZIP contains only `NEMESIS.data` and `Packages/jellyfin.gen5w.libre.zip`. Source code is provided separately in this repository and as a release source archive.\n\n## Source code\n\n- **[Browse the source code](SOURCE-CODE.md)** - links to the application, network helper and build files.\n- **[Download the complete source code ZIP](https://github.com/ntwm787/Jellyfin-on-GEN5W/releases/download/v1.0.0/Jellyfin-on-GEN5W-v1.0.0-Source.zip)**.\n- [Build instructions](docs/BUILD.md).\n\n## Requirements\n\nA Gen5W system running Android 4.4 / API 19 with 32-bit ARM and NEMESIS installed, plus a Jellyfin server reachable through head-unit **Wi-Fi**, such as a phone hotspot.\n\nDesigned for Gen5W without a firmware-version or vehicle-model lock. Other infotainment generations are not supported. Vehicle testing confirms the tested setup, not every Gen5W variant.\n\n## Setup order\n\n1. Install the **[Gen5 codec patch](https://github.com/KramerTech/gen5-codec-patch)**.\n2. Install **[KeyBORD](https://github.com/ntwm787/KeyBORD-Gen5W)**.\n3. Activate the keyboard using **KeyBridge**, provided in the [KeyBORD repository](https://github.com/ntwm787/KeyBORD-Gen5W).\n4. Install **Jellyfin on GEN5W**.\n\nTo install Jellyfin, park the vehicle and let the head unit finish booting. Extract the USB installer ZIP to the USB root. Keep `jellyfin.gen5w.libre.zip` intact inside the NEMESIS **`Packages` folder**, with `NEMESIS.data` at the root. Use one NEMESIS operation per drive. Insert the drive, confirm installation and launch **Jellyfin on GEN5W** from NEMESIS Manager.\n\n## Keyboard and sign-in\n\nAfter KeyBORD is activated with KeyBridge, you can use the keyboard in Jellyfin. If KeyBORD already works on your head unit, it will work here too; no setup again is needed.\n\nConnect the head unit to Wi-Fi and wait for network protection to be ready. Use the keyboard to enter at least your **server address and username** when signing in with a username, plus your password if required.\n\n**Quick Connect works!** Enter the server address and choose Quick Connect on the Jellyfin sign-in screen as an alternative to entering a username and password. The server screen also has **KeyBORD setup & sign-in** help.\n\n## Confirmed behavior\n\n- Video and audio playback work; audio is fully restored in this release.\n- In-player **audio-track and subtitle selection work**. Track changes may reload the stream at the current position.\n- The Back button and left-edge swipe stop video and return to the previous Jellyfin screen.\n- The factory media-app screen appears only when exiting the app, reported by the tester as normal head-unit behavior.\n- Quick Connect works.\n\nSee the [testing record](docs/TESTED.md) for the confirmation and its scope.\n\n## Playback and network rules\n\n- Video requires fresh factory confirmation that the vehicle is stationary in Park. Unknown vehicle status blocks video.\n- Streaming adapts to connection speed, up to **1080p**.\n- Content downloads are disabled.\n## Network protection\n\nJellyfin includes a small background helper installed through NEMESIS. It restricts Jellyfin's internet access to Wi-Fi so the app cannot use the BlueLink modem.\n\nThe USB installer installs both Jellyfin and this helper. Installing the APK by itself does not include the helper.\n\n**Install using the NEMESIS USB package. It includes the protection that blocks BlueLink modem data.**\n\nUse head-unit Wi-Fi or a phone hotspot. Android Auto internet sharing has not been verified for this app.\n\n## Licenses and credits\n\nThe Jellyfin Android application retains the upstream **GNU GPL v2** license. The Jellyfin API client retains its MIT license, and vendored ExoPlayer, Koin and ModernAndroidPreferences retain Apache-2.0 licenses. Original notices remain in their source trees. Installer/wrapper code retains its separate MIT notice; that does not relicense the Jellyfin app.\n\nRead [CREDITS.md](CREDITS.md), [THIRD-PARTY-NOTICES.md](THIRD-PARTY-NOTICES.md), [LICENSE](LICENSE) and [build instructions](docs/BUILD.md).\n","SOURCE-CODE.md":"# Source code\n\n## Browse the source files\n\n| What you want to view | Source location |\n|---|---|\n| Jellyfin application code and resources | [Application source](jellyfin-gen5w/app/src/main/) |\n| Complete Android project, dependencies and build configuration | [Android project source](jellyfin-gen5w/) |\n| Wi-Fi / BlueLink network protection helper | [Network helper source](network-guard/) |\n| NEMESIS installer descriptor and scripts | [Installer source](packaging/) |\n| Build and packaging tools | [Build tools source](tools/) |\n\n## Download the source code\n\n**[Download the complete source code ZIP](https://github.com/ntwm787/Jellyfin-on-GEN5W/releases/download/v1.0.0/Jellyfin-on-GEN5W-v1.0.0-Source.zip)** for v1.0.0.\n\nSee the [build instructions](docs/BUILD.md), [Jellyfin and third-party credits](CREDITS.md), [GPL license](LICENSE) and [third-party license notices](THIRD-PARTY-NOTICES.md).\n","RELEASE-NOTES.md":"# Jellyfin on GEN5W - v1.0.0\n\nFirst public release.\n\n**Tested and confirmed working on a Gen5W head unit.**\n\n- Audio is fully working.\n- In-player audio-track and subtitle selection work.\n- Video and Back/button swipe navigation work.\n- The factory media-app screen appears only when exiting Jellyfin, reported as normal head-unit behavior.\n- Quick Connect works.\n\n## Source code\n\n**[Browse the source code](https://github.com/ntwm787/Jellyfin-on-GEN5W/blob/v1.0.0/SOURCE-CODE.md)** or download the **Source code (complete project)** asset below. The source ZIP contains the application, build files, installer, network helper and licenses.\n\n## Setup order\n\n1. Install the **[Gen5 codec patch](https://github.com/KramerTech/gen5-codec-patch)**.\n2. Install **[KeyBORD](https://github.com/ntwm787/KeyBORD-Gen5W)**.\n3. Activate the keyboard using **KeyBridge**, provided in the [KeyBORD repository](https://github.com/ntwm787/KeyBORD-Gen5W).\n4. Install **Jellyfin on GEN5W**.\n\nDownload the USB ZIP and extract it to USB root. Keep the inner ZIP intact inside the NEMESIS **Packages** folder. Complete source is provided separately in the repository and Source ZIP. SHA256SUMS.txt covers both ZIPs.\n\nAfter activation with KeyBridge, use KeyBORD to enter your server address and username. An already-working KeyBORD works in Jellyfin. **Quick Connect works** as an alternative to username/password sign-in after entering the server address.\n\nRequires NEMESIS, Gen5W Android API19/ARM, the separate Gen5 codec patch and Wi-Fi. BlueLink modem data and downloads are blocked. Video requires confirmed stationary-in-Park status. Streaming adapts to connection speed up to 1080p. There is no firmware-version or model lock; every Gen5W variant has not been tested.\n\n## Network protection\n\nJellyfin includes a small background helper installed through NEMESIS. It restricts Jellyfin's internet access to Wi-Fi so the app cannot use the BlueLink modem.\n\nThe USB installer installs both Jellyfin and this helper. Installing the APK by itself does not include the helper.\n\n**Install using the NEMESIS USB package. It includes the protection that blocks BlueLink modem data.**\n\nThis independent port is based on Jellyfin Android v2.1.1 Libre. Credit goes to the Jellyfin project and contributors. The application retains its upstream GPL v2 license. MIT/Apache licenses and original copyright notices are preserved; see CREDITS.md and THIRD-PARTY-NOTICES.md. NEMESIS, KeyBORD and the codec patch are separate projects.\n\nThe released APK is the exact vehicle-tested binary. Release preparation changes documentation, credits and package notices only.\n","tools/package.py":"\"\"\"Package an APK as a USB installer with corresponding source and licenses.\"\"\"\nfrom pathlib import Path\nimport argparse,hashlib,io,json,re,zipfile\nROOT=Path(__file__).resolve().parents[1]\ndef pack(files):\n    b=io.BytesIO()\n    with zipfile.ZipFile(b,'w',zipfile.ZIP_DEFLATED) as z:\n        for name,data in sorted(files.items()):\n            i=zipfile.ZipInfo(name,(2026,11,5,0,0,0));i.create_system=3;i.compress_type=zipfile.ZIP_DEFLATED\n            i.external_attr=(0o100755 if name.endswith(('.sh','gradlew')) else 0o100644)<<16\n            z.writestr(i,data)\n    return b.getvalue()\ndef main():\n    p=argparse.ArgumentParser();p.add_argument('--apk',type=Path,required=True);p.add_argument('--out',type=Path,default=ROOT/'dist');a=p.parse_args()\n    apk=a.apk.read_bytes();v=json.loads((ROOT/'docs/RELEASE-MANIFEST.json').read_text())['public_version'];name='Jellyfin-on-GEN5W-v'+v\n    meta=(ROOT/'packaging/NEMESIS.data').read_bytes()\n    for key,limit in [('short-desc',64),('detailed-desc',256)]:\n        t=re.search(r'(?m)^'+key+r'=(.*)$',meta.decode());assert t and len(t.group(1).rstrip('\\r'))<=limit\n    assert ('package-version='+v).encode() in meta\n    with zipfile.ZipFile(io.BytesIO(apk)) as z:assert z.testzip() is None\n    inner={'NEMESIS.data':meta,'app/Jellyfin-on-GEN5W.apk':apk,'scripts/pre.sh':(ROOT/'packaging/scripts/pre.sh').read_bytes()}\n    for folder,prefix in [('network-guard','guard'),('licenses','licenses')]:\n        for f in (ROOT/folder).iterdir():\n            if f.is_file():inner[prefix+'/'+f.name]=f.read_bytes()\n    for f in ['README.md','SOURCE-CODE.md','CREDITS.md','THIRD-PARTY-NOTICES.md','MODIFICATIONS.md']:inner[f]=(ROOT/f).read_bytes()\n    inner['TESTED.md']=(ROOT/'docs/TESTED.md').read_bytes()\n    source={}\n    for f in ROOT.rglob('*'):\n        if not f.is_file():continue\n        rel=f.relative_to(ROOT)\n        if any(x in {'.git','.gradle','build','dist','work','__pycache__'} for x in rel.parts):continue\n        if f.name=='local.properties' or f.suffix.lower() in {'.apk','.zip','.jks','.keystore','.p12','.pem','.key'}:continue\n        source['Jellyfin-on-GEN5W/'+rel.as_posix()]=f.read_bytes()\n    a.out.mkdir(parents=True,exist_ok=True)\n    assets={name+'-USB.zip':pack({'NEMESIS.data':(ROOT/'packaging/USB-NEMESIS.data').read_bytes(),'Packages/jellyfin.gen5w.libre.zip':pack(inner)}),name+'-Source.zip':pack(source)}\n    for n,d in assets.items():(a.out/n).write_bytes(d)\n    manifest={n:{'sha256':hashlib.sha256(d).hexdigest(),'bytes':len(d)} for n,d in assets.items()}\n    (a.out/'SHA256SUMS.txt').write_text(''.join(i['sha256']+'  '+n+'\\n' for n,i in sorted(manifest.items())),encoding='utf-8')\n    print(json.dumps(manifest,indent=2))\nif __name__=='__main__':main()\n"}
          for filename,text in updates.items():
              Path(filename).write_text(text,encoding='utf-8')
          assert '## Source code' in Path('README.md').read_text()
          assert Path('SOURCE-CODE.md').is_file()
          Path('.github/workflows/label-source-code.yml').unlink()
          Path('SHA256SUMS.txt').unlink()
          apk_path=Path('/tmp/vehicle-tested.apk');apk_path.write_bytes(apk)
          output=Path('/tmp/release-docs-update')
          subprocess.run(['python3','tools/package.py','--apk',str(apk_path),'--out',str(output)],check=True)
          assets={p.name:p.read_bytes() for p in output.iterdir() if p.is_file()}
          assert set(assets)==set(previous)
          Path('SHA256SUMS.txt').write_bytes(assets['SHA256SUMS.txt'])
          changes=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changes<=set(updates)|{'.github/workflows/label-source-code.yml','SHA256SUMS.txt'},changes
          subprocess.run(['git','config','user.name','ntwm787'],check=True)
          subprocess.run(['git','config','user.email','349138637+ntwm787@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--all'],check=True)
          subprocess.run(['git','commit','-m','Add clearly labeled source code navigation and download'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          oldtag=api(base+'/git/ref/tags/v1.0.0');assert oldtag['object']['sha']=='b133d40133690d7cc57479403f7b9f10e3ef0b81'
          api(base+'/git/refs/tags/v1.0.0',{'sha':commit,'force':True},'PATCH')
          release=api(base+'/releases/436160397',{'body':Path('RELEASE-NOTES.md').read_text(),'target_commitish':commit},'PATCH')
          upload=release['upload_url'].split('{',1)[0]
          for n,b in assets.items():
              api(base+'/releases/assets/'+str(previous[n]['id']),method='DELETE')
              result=api(upload+'?name='+urllib.parse.quote(n)+('&label='+urllib.parse.quote('Source code (complete project)') if n.endswith('-Source.zip') else ''),b,'POST','application/zip' if n.endswith('.zip') else 'text/plain')
              assert result['size']==len(b)
          print('Updated documentation and release downloads:',release['html_url'])
          PY
