apply plugin: 'com.android.library'
android {
    compileSdkVersion 30
    buildToolsVersion '29.0.3'
    defaultConfig { minSdkVersion 19; targetSdkVersion 30 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.1.0'
    implementation 'com.google.guava:guava:27.1-android'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'org.checkerframework:checker-qual:3.3.0'
    compileOnly 'org.checkerframework:checker-compat-qual:2.5.0'
    compileOnly 'org.jetbrains.kotlin:kotlin-annotations-jvm:1.3.70'
    api project(':exo-common')
    api project(':exo-extractor')
}
